apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservice2-qa
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL:  https://openshift-gitops-server-openshift-gitops.apps.ocp4.example.com
    targetRevision: HEAD
    path: kustomize/overlays/qa/microservice2
  destination:
    server: https://kubernetes.default.svc
    namespace: qa-namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
