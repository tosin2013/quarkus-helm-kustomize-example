apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservice1-prod
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL:  https://openshift-gitops-server-openshift-gitops.apps.ocp4.example.com
    targetRevision: HEAD
    path: kustomize/overlays/prod/microservice1
  destination:
    server: https://kubernetes.default.svc
    namespace: prod-namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
