apiVersion: v1
kind: Namespace
metadata:
  name: qa-namespace
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: microservice2-sa
  namespace: qa-namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid
  namespace: qa-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
- kind: ServiceAccount
  name: microservice2-sa
  namespace: qa-namespace
---
apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Custom microservice2 Nginx Page</title>
    </head>
    <body>
      <h1>Welcome to My Custom microservice2 Nginx Page!</h1>
    </body>
    </html>
kind: ConfigMap
metadata:
  name: microservice2-html
  namespace: qa-namespace
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: microservice2
  name: microservice2
  namespace: qa-namespace
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: microservice2
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: microservice2
  name: microservice2
  namespace: qa-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservice2
  template:
    metadata:
      labels:
        app: microservice2
    spec:
      containers:
      - image: nginx:1.27.2
        name: microservice2
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: html-volume
      serviceAccountName: microservice2-sa
      volumes:
      - configMap:
          name: microservice2-html
        name: html-volume
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: microservice2
  namespace: qa-namespace
spec:
  host: microservice2-qa.qa.apps.ocp4.example.com
  port:
    targetPort: http
  tls:
    insecureEdgeTerminationPolicy: None
    termination: edge
  to:
    kind: Service
    name: microservice2
    weight: 100
  wildcardPolicy: None
